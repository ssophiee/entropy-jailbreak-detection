# ── Model settings ────────────────────────────────────────────────────────────
model:
  name: "Qwen/Qwen2.5-3B-Instruct"

  # Path to LoRA adapter. Can be a local path or a HuggingFace model ID.
  # Set source to "local" or "huggingface" accordingly.
  path: "saved_models/lora_rank16_epochs5_lr_1e_2_2412_epochs3"
  source: "local"       # "local" or "huggingface"

  device: "auto"        # "cuda", "cpu", or "auto"

# ── Evaluation parameters ─────────────────────────────────────────────────────
evaluation:
  temperature: 0.05
  balance_seed: 42  

  # Max prompts to load per dataset before balancing.
  # Set to "max" to load the full dataset (balance_prompts will then trim both sides to the smaller class).
  n_samples_per_dataset: "max"

  approach: "laplace_approx"    # "laplace_approx" or "ensemble_lora"
  n_posterior_samples: 50
  run_all: true                 # run all 20 score keys
  score_keys:                   # only used when run_all is false
    - "slope"
    - "spearman_rho"
    - "peak_pos"

# ── Output settings ───────────────────────────────────────────────────────────
output:
  base_dir: "results/multi_dataset"
  write_summary_csv: true

# ── Datasets ──────────────────────────────────────────────────────────────────
# The runner evaluates every combination of harmful × safe datasets below.
# Names must match keys in DATASET_REGISTRY (src/data_utils.py).

harmful_datasets:
  - "advbench"                  # walledai/AdvBench (520)
  - "strongreject"              # walledai/StrongREJECT (313)
  - "toxic_chat"                # lmsys/toxic-chat jailbreaking=1 (~220)
  # - "wildjailbreak_harmful"     # allenai/wildjailbreak adversarial_harmful

safe_datasets:
  - "ultrachat"                 # HuggingFaceH4/ultrachat_200k
  # - "dolly"                     # databricks/databricks-dolly-15k
  - "xstest"                    # walledai/XSTest (250 safe prompts)
  - "jailbreakbench_benign"     # JailbreakBench/JBB-Behaviors benign (100)
  # - "wildjailbreak_benign"      # allenai/wildjailbreak adversarial_benign
  # - "orbench"                   # bench-llm/or-bench hard-1k
